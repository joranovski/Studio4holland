# ══════════════════════════════════════════════════════════
# Studio 4 Holland · Netlify-instellingen
# (vervangt Kirby, PHP en de .htaccess van de oude hosting)
# ══════════════════════════════════════════════════════════

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ── De voordeur: Engelstalige browsers naar /en/, de rest naar /nl/ ──
# force = true, want er staat ook een index.html op / (terugval zonder Netlify).
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true
  conditions = {Language = ["en"]}

[[redirects]]
  from = "/"
  to = "/nl/"
  status = 302
  force = true

# ── Oude Kirby-adressen ──────────────────────────────────
# De adressen /nl/<sectie>/<item> en /en/<sectie>/<item> zijn hetzelfde gebleven.
# Netlify plakt zelf de slash erachter (/nl/turntables/drum-deck → /nl/turntables/drum-deck/).

# Kirby kende ook pagina-adressen zonder taal
[[redirects]]
  from = "/home"
  to = "/nl/"
  status = 301

[[redirects]]
  from = "/nl/home"
  to = "/nl/"
  status = 301

[[redirects]]
  from = "/en/home"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/speakers/*"
  to = "/nl/speakers/:splat"
  status = 301

[[redirects]]
  from = "/turntables/*"
  to = "/nl/turntables/:splat"
  status = 301

[[redirects]]
  from = "/hextech-feet/*"
  to = "/nl/hextech-feet/:splat"
  status = 301

[[redirects]]
  from = "/repairs/*"
  to = "/nl/repairs/:splat"
  status = 301

[[redirects]]
  from = "/technics-reparaties/*"
  to = "/nl/repairs/:splat"
  status = 301

[[redirects]]
  from = "/nl/technics-reparaties/*"
  to = "/nl/repairs/:splat"
  status = 301

[[redirects]]
  from = "/connections/*"
  to = "/nl/connections/:splat"
  status = 301

[[redirects]]
  from = "/interiors/*"
  to = "/nl/interiors/:splat"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/nl/contact/"
  status = 301

# Directe links naar oude foto's (/media/pages/<sectie>/…) gaan naar de sectie
[[redirects]]
  from = "/media/pages/home/*"
  to = "/nl/"
  status = 301

[[redirects]]
  from = "/media/pages/:section/*"
  to = "/nl/:section/"
  status = 301

# Het Kirby-paneel bestaat niet meer
[[redirects]]
  from = "/panel/*"
  to = "/nl/"
  status = 301

# ── Items die (nog) niet op de nieuwe site staan ─────────
# Zonder force werkt dit alleen als er geen pagina bestaat: een onbekend item valt terug
# op het overzicht van zijn sectie in plaats van een 404. Tijdelijk (302), omdat de
# nieuwere items van de live site later nog worden toegevoegd.
[[redirects]]
  from = "/nl/:section/*"
  to = "/nl/:section/"
  status = 302

[[redirects]]
  from = "/en/:section/*"
  to = "/en/:section/"
  status = 302

# ── Headers ─────────────────────────────────────────────
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# https, kaal → www, de 404-pagina en compressie regelt Netlify zelf.
